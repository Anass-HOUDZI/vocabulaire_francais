<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lexique — mémoriser le vocabulaire français avancé par répétition espacée." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#8a3d2e" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Lexique — vocabulaire français avancé</title>
    <script>
      // Applique le thème avant le premier paint pour éviter le flash clair/sombre.
      try {
        var t = localStorage.getItem('lexique.theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
